name: stream_vault
description: "StreamVault - Ad-free stream player and offline archiver for iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.5
  chewie: ^1.8.5
  video_player: ^2.9.2
  youtube_explode_dart: ^2.2.3
  permission_handler: ^11.3.1
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
